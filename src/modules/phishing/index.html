<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Phishing Frenzy</title>
  <link rel="stylesheet" href="../../css/themes.css" />
  <link rel="stylesheet" href="../../css/modules.css" />
  <style>
    body.light-mode {
      background: linear-gradient(to right, #7dd3fc, #4ade80);
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .game-container {
      background: white;
      border-radius: 20px;
      padding: 2rem;
      max-width: 800px;
      width: 90%;
      box-shadow: 0 12px 30px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
      margin-bottom: 1.5rem;
      font-size: 2rem;
      color: #0f172a;
    }

    #game-area {
      margin-bottom: 2rem;
    }

    #submit-btn {
      display: block;
      margin: 0 auto;
      padding: 0.75rem 1.5rem;
      background-color: #4ade80;
      color: white;
      font-size: 1rem;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    #submit-btn:hover {
      background-color: #22c55e;
    }
  </style>
</head>
<body class="light-mode">
  <main class="game-container">
    <h1>🎣 Phishing Frenzy</h1>
    <div id="game-area">
      <!-- Questions will load here -->
    </div>
    <button id="submit-btn">Submit Score</button>
  </main>

  <script type="module" src="logic.js"></script>
</body>
</html>
